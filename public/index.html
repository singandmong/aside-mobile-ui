<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=5">
  <title>Aside Mobile</title>
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" type="button" aria-label="뒤로" hidden>‹</button>
    <div class="titles">
      <h1 id="title">Aside</h1>
      <p id="subtitle" class="subtitle">실행 환경 선택</p>
    </div>
    <button id="tools-btn" class="icon-btn" type="button" aria-label="브라우저 도구" hidden>⌘</button>
    <button id="refresh" class="icon-btn" type="button" aria-label="새로고침">↻</button>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="view"></main>

  <form id="composer" class="composer" hidden>
    <textarea id="prompt" rows="1" placeholder="Aside에게 요청하기" autocomplete="off" enterkeyhint="send"></textarea>
    <button id="send" class="send-btn" type="submit" aria-label="보내기">↑</button>
  </form>

  <dialog id="auth" class="sheet">
    <form method="dialog" id="auth-form">
      <h2>접속 인증</h2>
      <p class="muted">Tailscale 인증이 없거나 허용되지 않은 사용자입니다. 서버의 <code>ASIDE_MOBILE_TOKEN</code>을 입력하세요. 토큰은 이 기기에만 저장됩니다.</p>
      <input id="token" type="password" autocomplete="off" placeholder="토큰">
      <div class="row"><button class="primary" value="ok">접속</button></div>
    </form>
  </dialog>

  <dialog id="tools" class="sheet">
    <div class="sheet-head"><h2>브라우저 도구</h2><button class="icon-btn" type="button" data-close aria-label="닫기">✕</button></div>
    <p class="muted">선택한 실행 환경의 Aside 브라우저 탭입니다. 필요할 때만 불러옵니다.</p>
    <div id="tab-list" class="list"></div>
    <div id="tab-panel" hidden>
      <div class="row wrap">
        <button type="button" data-tool="dom">내용 보기</button>
        <button type="button" data-tool="shot">스크린샷</button>
        <button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="Enter">Enter</button>
        <button type="button" data-scroll="-600">위로</button>
        <button type="button" data-scroll="600">아래로</button>
      </div>
      <form id="type-form" class="row"><input id="type-text" autocomplete="off" placeholder="선택한 페이지에 입력"><button>입력</button></form>
      <div id="tool-output" class="tool-output"></div>
    </div>
  </dialog>

  <dialog id="pair" class="sheet">
    <div class="sheet-head"><h2>다른 컴퓨터 연결</h2><button class="icon-btn" type="button" data-close aria-label="닫기">✕</button></div>
    <div id="pair-body"></div>
    <p class="section-title">연결된 컴퓨터</p>
    <div id="connector-list" class="list"></div>
  </dialog>

  <script src="/app.js?v=5" type="module"></script>
</body>
</html>
