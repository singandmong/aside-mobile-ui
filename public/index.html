<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">PRIVATE TAILNET</p><h1>Aside Mobile</h1></div><button id="refresh">새로고침</button></header>
    <p id="status" class="status">연결 중…</p>
    <section id="auth-panel" class="panel"><h2>접속 토큰</h2><form id="auth-form"><input id="token" type="password" autocomplete="off" placeholder="ASIDE_MOBILE_TOKEN"><button>접속</button></form></section>
    <section class="panel"><h2>Aside 작업</h2><form id="prompt-form"><input id="prompt" autocomplete="off" placeholder="새 작업 또는 선택한 작업의 후속 질문"><button>보내기</button><button id="close-session" type="button">닫기</button><button id="stop" type="button">중지</button></form><div id="sessions" class="list"></div><div id="messages" class="messages">작업을 선택하세요</div></section>
    <section class="panel"><h2>컴퓨터</h2><div id="hosts" class="cards"></div></section>
    <section class="panel"><h2>브라우저 탭</h2><div id="tabs" class="tabs"></div><button id="show-dom" type="button" disabled>선택한 탭 내용 보기</button><div id="dom-view" class="dom-view empty">필요할 때만 탭 내용을 불러옵니다</div><details><summary>스크린샷 보기</summary><button id="capture" type="button" disabled>스크린샷 요청</button><div id="frame" class="frame empty">요청할 때만 화면을 가져옵니다</div></details><div class="controls"><button data-action="scroll" data-dy="-600">↑</button><button data-action="scroll" data-dy="600">↓</button><button data-action="key" data-key="Escape">Esc</button><button data-action="key" data-key="Enter">Enter</button></div><form id="type-form"><input id="text" autocomplete="off" placeholder="선택한 페이지에 입력"><button>입력</button></form></section>
  </main>
  <script src="/app.js?v=4" type="module"></script>
</body>
</html>
